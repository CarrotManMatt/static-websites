[project]  # TODO: Remove [project] table once https://github.com/astral-sh/uv/issues/8582 is completed
name = "static-websites"
version = "1.0.0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
    { include-group = "lint-format" },
    { include-group = "pre-commit" },
    { include-group = "type-check" },
]
lint-format = ["flake8-carrot>=0.1.1", "flake8-pyproject>=1.2", "ruff>=0.17"]
main = ["gitpython>=3.1", "htpy>=25", "markupsafe>=3.0", "typed_classproperties>=1.1"]
pre-commit = ["prek>=0.5.3"]
type-check = ["ty>=0.0.99"]

[tool.codespell]
skip = "static/*/bootstrap-*,static/*/js/*.min.js,static/*/webfonts/**,*.svg,static/*/fontawesome-*,static/*/entry-server-routing.js,static/*/pages_index.js"

[tool.flake8]
ignore = ["CAR110", "CAR163"]
select = ["CAR"]
extend_exclude = [".venv/"]
require_plugins = ["flake8-carrot"]

[tool.ruff]
indent-width = 4
line-length = 95
output-format = "concise"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
external = ["CAR"]
ignore = [
    "C90",
    "COM812",
    "COM819",
    "CPY",
    "D107",
    "D206",
    "D212",
    "FA",
    "ICN001",
    "INP001",
    "ISC001",
    "ISC002",
    "N806",
    "PIE808",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "S603",
    "SIM910",
    "TD002",
    "TD003",
    "W191",
]
select = ["ALL", "D204", "D213", "D401"]
task-tags = ["BUG", "DONE", "FIXME", "HACK", "IDEA", "ISSUE", "NOBUG", "NOTE", "REQ", "TODO"]

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["abc", "date", "datetime", "functools", "itertools", "re", "regex"]
extend-aliases = { "htpy" = "h" }

[tool.ruff.lint.flake8-type-checking]
exempt-modules = []
quote-annotations = true
strict = true

[tool.ruff.lint.isort]
known-first-party = [
    "build",
    "cleanup",
    "components",
    "console",
    "deploy",
    "exceptions",
    "sites",
    "utils"
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "typed_classproperties.cached_classproperty",
    "typed_classproperties.classproperty",
]
extend-ignore-names = [
    "BROKEN_*_MESSAGE",
    "DEFAULT_MESSAGE",
    "INVALID_*_MESSAGE",
    "NO_*_MESSAGE",
]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true
max-doc-length = 95

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = [
    "typed_classproperties.cached_classproperty",
    "typed_classproperties.classproperty",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "int", "str"]
max-args = 7
max-branches = 19
max-returns = 10

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.tombi.format.rules]
indent-width = 4
line-width = 95

[tool.ty.rules]
blanket-ignore-comment = "error"
disjoint-cast = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
mismatched-sentinel-name = "warn"
missing-direct-dependency = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
redundant-condition-strict = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"
unused-ignore-comment = "error"

[tool.uv]
default-groups = ["dev", "main"]
no-build = true
package = false
required-version = ">=0.6.10"
